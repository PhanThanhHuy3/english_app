version: '3.8'

services:
  # Database
  mongodb:
    image: mongo:latest
    container_name: english-app-db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # Backend Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: english-app-backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/english_app
      - PORT=5000
    depends_on:
      - mongodb
    restart: unless-stopped

  # Frontend Web
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: english-app-frontend
    ports:
      - "8000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
